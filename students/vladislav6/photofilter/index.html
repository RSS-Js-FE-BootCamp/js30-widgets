<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon">
  <title>Photofilter</title>
</head>
<body>
  <div class="wrapper">
    <header>
      <h1 class="title">Photofilter in <span class="highlight">JS</span></h1>
      <div class="filters">
        <label class="spacing">Spacing: 
          <input type="range" min="10" max="200" value="10">
        </label>
        <label class="blur">Blur: 
          <input type="range" min="0" max="25" value="10">
        </label>
        <label class="base-color">Base color: 
          <input type="color" value="#ffc600">
        </label>
      </div>
    </header>
    <main>
      <section class="editor">
        <div class="preview">
          <img src="./assets/picture.jpg" alt="Editeble picture">
        </div>
      </section>
    </main>
  </div>
</body>
</html>
