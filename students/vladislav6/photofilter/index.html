<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon">
  <title>Photofilter</title>
</head>
<body>
  <div class="wrapper">
    <header>
      <h1 class="title">Photofilter in <span class="highlight">JS</span></h1>
      <div class="filters">
        <label for="Spacing">Spacing: 
          <input id="spacing" type="range" name="spacing" min="10" max="200" value="10">
        </label>
        <label for="blur">Blur: 
          <input id="blur" type="range" name="blur" min="0" max="25" value="10">
        </label>
        <label for="base-color">Base color: 
          <input id="color" type="color" name="color" value="#ffc600">
        </label>
      </div>
    </header>
    <main>
      <section class="editor">
        <div class="preview">
          <img class="picture-edit" src="./assets/picture.jpg" alt="Editeble picture">
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
