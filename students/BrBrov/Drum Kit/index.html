<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drum Kit</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>

<body>
  <div class="page">
    <div class="drum-kit">
      <h1 class="drum-kit__label">Drum Kit</h1>
      <div class="drum-kit__keywords">
        <button class="drum-kit__button" data-key="a">
          <span class="drum-kit__key">s</span>
          <span class="drum-kit__title">clap</span>
        </button>
        <button class="drum-kit__button" data-key="s">
          <span class="drum-kit__key">s</span>
          <span class="drum-kit__title">hithat</span>
        </button>
        <button class="drum-kit__button" data-key="d">
          <span class="drum-kit__key">d</span>
          <span class="drum-kit__title">kick</span>
        </button>
        <button class="drum-kit__button" data-key="f">
          <span class="drum-kit__key">f</span>
          <span class="drum-kit__title">openhat</span>
        </button>
        <button class="drum-kit__button" data-key="g">
          <span class="drum-kit__key">g</span>
          <span class="drum-kit__title">boom</span>
        </button>
        <button class="drum-kit__button" data-key="h">
          <span class="drum-kit__key">h</span>
          <span class="drum-kit__title">ride</span>
        </button>
        <button class="drum-kit__button" data-key="j">
          <span class="drum-kit__key">j</span>
          <span class="drum-kit__title">snare</span>
        </button>
        <button class="drum-kit__button" data-key="k">
          <span class="drum-kit__key">k</span>
          <span class="drum-kit__title">tom</span>
        </button>
        <button class="drum-kit__button" data-key="l">
          <span class="drum-kit__key">l</span>
          <span class="drum-kit__title">Tink</span>
        </button>
      </div>
    </div>
  </div>

</body>

</html>
