<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
  <title>JS Clock</title>
</head>

<body>
  <div class="page">
    <div class="clock">
      <div class="clock__face">

      </div>
      <div class="clock__data">
        <div class="clock__time">
          <span class="clock__time-hour">00</span>
          <span class="clock__time-dots">:</span>
          <span class="clock__time-minute">00</span>
          <span class="clock__time-dots">:</span>
          <span class="clock__time-second">00</span>
        </div>
        <div class="clock__date">
          <span class="clock__date-day">Friday</span>
          <span class="clock__date-qoute">,</span>
          <span class="clock__date-number">1</span>
          <span class="clock__date-space"> </span>
          <span class="clock__date-mounth">january</span>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
