<!DOCTYPE html>
<html data-theme='light' lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="shortcut icon" href="./src/img/bg,f8f8f8-flat,750x,075,f-pad,750x1000,f8f8f8.jpg" type="image/x-icon">
	<link rel="stylesheet" href="./style.css">
</head>
<body>
	<div class="theme">Switch</div>
	<div class="keys">
		<div data-key="65" class="key">
			<kbd>A</kbd>
			<span class="sound">CLAP</span>
		</div>
		<div data-key="83" class="key">
			<kbd>S</kbd>
			<span class="sound">HIHAT</span>
		</div>
		<div data-key="68" class="key">
			<kbd>D</kbd>
			<span class="sound">kick</span>
		</div>
		<div data-key="70" class="key">
			<kbd>F</kbd>
			<span class="sound">OPENHAT</span>
		</div>
		<div data-key="71" class="key">
			<kbd>G</kbd>
			<span class="sound">BOOM</span>
		</div>
		<div data-key="72" class="key">
			<kbd>H</kbd>
			<span class="sound">RIDE</span>
		</div>
		<div data-key="74" class="key">
			<kbd>J</kbd>
			<span class="sound">SNARE</span>
		</div>
		<div data-key="75" class="key">
			<kbd>K</kbd>
			<span class="sound">TOM</span>
		</div>
		<div data-key="76" class="key">
			<kbd>L</kbd>
			<span class="sound">TINK</span>
		</div>
	</div>
	<button class="play-btn">PLAY</button>
	<audio data-key="65" src="./src/sounds/clap.mp3"></audio>
	<audio data-key="83" src="./src/sounds/hihat.mp3" ></audio>
	<audio data-key="68" src="./src/sounds/kick.mp3"></audio>
	<audio data-key="70" src="./src/sounds/openhat.mp3"></audio>
	<audio data-key="71" src="./src/sounds/boom.mp3"></audio>
	<audio data-key="72" src="./src/sounds/ride.mp3"></audio>
	<audio data-key="74" src="./src/sounds/snare.mp3"></audio>
	<audio data-key="75" src="./src/sounds/tom.mp3"></audio>
	<audio data-key="76" src="./src/sounds/tink.mp3"></audio>
	<script src="script.js"></script>
</body>
</html>
