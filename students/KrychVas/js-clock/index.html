<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS + CSS Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="clock">
    <div class="clock-face">
      <div class="hand hour-hand"></div>
      <div class="hand min-hand"></div>
      <div class="hand second-hand"></div>
    </div>
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="base-color">Циферблат:</label>
      <input id="base-color" type="color" name="base" value="#ffffff">
    </div>
    
    <div class="control-group">
      <label for="hand-color">Стрілки:</label>
      <input id="hand-color" type="color" name="hand" value="#000000">
    </div>
  </div>

  <div class="clock">
    <div class="clock-face">
      <div class="hand hour-hand"></div>
      <div class="hand min-hand"></div>
      <div class="hand second-hand"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
