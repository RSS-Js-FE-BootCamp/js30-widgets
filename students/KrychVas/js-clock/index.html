<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS + CSS Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="controls">
    <div class="control-group">
      <label for="base-color">Циферблат:</label>
      <input id="base-color" type="color" name="base" value="#ffffff">
    </div>
    
    <div class="control-group">
      <label for="hand-color">Стрілки:</label>
      <input id="hand-color" type="color" name="hand" value="#000000">
    </div>

    <button id="dial-toggle" class="sound-btn" title="Змінити тип цифр">🔢 ЦИФРИ</button>

    <!-- Група керування кольором цифр (прихована за замовчуванням через display: none) -->
    <div class="control-group" id="numbers-color-group" style="display: none;">
      <label for="numbers-color">Колір цифр:</label>
      <input id="numbers-color" type="color" name="numbers-color" value="#000000">
    </div>

    <button id="bg-toggle" class="sound-btn" title="Змінити фон">🖼️ ФОН</button>

    <button id="sound-toggle" class="sound-btn" title="Увімкнути/Вимкнути звук">🔇</button>
  </div>

  <div class="clock">
    <div class="clock-face">
      <div class="hand hour-hand"></div>
      <div class="hand min-hand"></div>
      <div class="hand second-hand"></div>
      
      <!-- Нове цифрове табло -->
      <div id="digital" class="digital-display">00:00:00</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
