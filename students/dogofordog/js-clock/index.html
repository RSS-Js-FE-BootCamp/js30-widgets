<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Clock</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="../../../favicon.svg">
</head>
<body>
  <div class="clock-wrapper">

    <article class="clock">
      <div class="hand hour-hand" id="hour"></div>
      <div class="hand min-hand" id="minute"></div>
      <div class="hand second-hand" id="second"></div>
      <div class="clock-center"></div>
    </article>

    <article class="digital">
      <div class="digital__time" id="digital-time"></div>
      <div class="digital__date" id="digital-date"></div>
    </article>

  </div>
  <script src="script.js" defer></script>
</body>
</html>
