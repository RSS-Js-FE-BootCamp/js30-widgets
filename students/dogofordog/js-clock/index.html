<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Clock</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="../../../favicon.svg">
</head>
<body>
  <button class="theme-toggle" id="theme-toggle">☀️</button>
  <div class="clock-wrapper">

    <article class="clock">
      <div class="hand hour-hand" id="hour"></div>
      <div class="hand min-hand" id="minute"></div>
      <div class="hand second-hand" id="second"></div>
      <div class="clock-center"></div>
    </article>

    <article class="digital">
      <div class="digital__time" id="digital-time"></div>
      <div class="digital__date" id="digital-date"></div>
    </article>

    <div class="progress-rings">
  <div class="ring-wrapper">
    <svg class="ring" viewBox="0 0 100 100">
      <circle class="ring-bg" cx="50" cy="50" r="45"/>
      <circle class="ring-fill" id="seconds-ring" cx="50" cy="50" r="45"/>
    </svg>
    <div class="ring-text">
      <span class="ring-value" id="seconds-value">00</span>
      <span class="ring-label">SEC</span>
    </div>
  </div>

  <div class="ring-wrapper">
    <svg class="ring" viewBox="0 0 100 100">
      <circle class="ring-bg" cx="50" cy="50" r="45"/>
      <circle class="ring-fill" id="minutes-ring" cx="50" cy="50" r="45"/>
    </svg>
    <div class="ring-text">
      <span class="ring-value" id="minutes-value">00</span>
      <span class="ring-label">MIN</span>
    </div>
  </div>

  <div class="ring-wrapper">
    <svg class="ring" viewBox="0 0 100 100">
      <circle class="ring-bg" cx="50" cy="50" r="45"/>
      <circle class="ring-fill" id="hours-ring" cx="50" cy="50" r="45"/>
    </svg>
    <div class="ring-text">
      <span class="ring-value" id="hours-value">00</span>
      <span class="ring-label">HRS</span>
    </div>
  </div>
</div>
  </div>
  <script src="script.js" defer></script>
</body>
</html>
