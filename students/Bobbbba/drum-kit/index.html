<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="./image/favicon.svg">
    <link rel="stylesheet" href="style.css">
    <title>Drum-kit</title>
  </head>
  <body>
    <div class="drum-kit-name">
      <div class="keys">
        <div data-key="65" class="key">
          <div class="letter_discription">
            <kbd class="letters">A</kbd>
            <p class="discription">clap</p>
          </div>
        </div>
        <div data-key="83" class="key">
          <div class="letter_discription">
            <kbd class="letters">S</kbd>
            <p class="discription">hihat</p>
          </div>
        </div>
        <div data-key="68" class="key">
          <div class="letter_discription">
            <kbd class="letters">D</kbd>
            <p class="discription">kick</p>
          </div>
        </div>
        <div data-key="70" class="key">
          <div class="letter_discription">
            <kbd class="letters">F</kbd>
            <p class="discription">openhat</p>
          </div>
        </div>
        <div data-key="71" class="key">
          <div class="letter_discription">
            <kbd class="letters">G</kbd>
            <p class="discription">boom</p>
          </div>
        </div>
        <div data-key="72" class="key">
          <div class="letter_discription">
            <kbd class="letters">H</kbd>
            <p class="discription">ride</p>
          </div>
        </div>
        <div data-key="74" class="key">
          <div class="letter_discription">
            <kbd class="letters">J</kbd>
            <p class="discription">snare</p>
          </div>
        </div>
        <div data-key="75" class="key">
          <div class="letter_discription">
            <kbd class="letters">K</kbd>
            <p class="discription">tom</p>
          </div>
        </div>
        <div data-key="76" class="key">
          <div class="letter_discription">
            <kbd class="letters">L</kbd>
            <p class="discription">tink</p>
          </div>
        </div>
      </div>
    </div>
    <audio data-key="65" src="./sounds/clap.wav"></audio>
    <audio data-key="83" src="./sounds/hihat.wav"></audio>
    <audio data-key="68" src="./sounds/kick.wav"></audio>
    <audio data-key="70" src="./sounds/openhat.wav"></audio>
    <audio data-key="71" src="./sounds/boom.wav"></audio>
    <audio data-key="72" src="./sounds/ride.wav"></audio>
    <audio data-key="74" src="./sounds/snare.wav"></audio>
    <audio data-key="75" src="./sounds/tom.wav"></audio>
    <audio data-key="76" src="./sounds/tink.wav"></audio>
  </body>
  <script src="./script.js"></script>
</html>
