<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Clock</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

     <div class="main-container">
    <div class="clock-wrapper">
      <!-- Аналоговые часы -->
      <div class="clock-face">
        <div class="hand hour-hand" id="hour-hand"></div>
        <div class="hand min-hand" id="min-hand"></div>
        <div class="hand second-hand" id="second-hand"></div>
        <div class="center-dot"></div>
        <div class="number number-12">12</div>
        <div class="number number-1">1</div>
        <div class="number number-2">2</div>
        <div class="number number-3">3</div>
        <div class="number number-4">4</div>
        <div class="number number-5">5</div>
        <div class="number number-6">6</div>
        <div class="number number-7">7</div>
        <div class="number number-8">8</div>
        <div class="number number-9">9</div>
        <div class="number number-10">10</div>
        <div class="number number-11">11</div>
      </div>

      <!-- Цифровой блок -->
      <div class="digital-block">
        <div class="time" id="digital-time">00:00:00</div>
        <div class="day" id="digital-day">Понедельник</div>
        <div class="date" id="digital-date">1 января</div>
        <div class="year" id="digital-year">2026</div>
      </div>

      <!-- Индикаторы прогресса -->
      <div class="extra-widgets">
        <div class="progress-ring">
          <div class="progress-circle" id="progress-hours">
            <span class="progress-label">Часы</span>
            <span class="progress-value" id="hours-progress">0%</span>
          </div>
          <div class="progress-circle" id="progress-minutes">
            <span class="progress-label">Минуты</span>
            <span class="progress-value" id="minutes-progress">0%</span>
          </div>
          <div class="progress-circle" id="progress-seconds">
            <span class="progress-label">Секунды</span>
            <span class="progress-value" id="seconds-progress">0%</span>
          </div>
        </div>
        <!-- Смена темы -->
        <div class="theme-toggle">
          <button id="theme-btn">🌙 Тёмная</button>
        </div>
      </div>
    </div>


<!-- БУДИЛЬНИК -->
    <div class="alarm-section">
      <div class="alarm-title">Будильник</div>
      <div class="alarm-controls">
        <div class="alarm-input-group">
          <label>Часы</label>
          <input type="number" id="alarm-hours" min="0" max="23" value="08" step="1">
        </div>
        <div class="alarm-input-group">
          <label>Минуты</label>
          <input type="number" id="alarm-minutes" min="0" max="59" value="00" step="1">
        </div>
        <button class="btn btn-primary" id="set-alarm-btn">Установить</button>
        <button class="btn btn-danger" id="clear-alarm-btn" disabled>Отключить</button>
        <button class="btn btn-warning" id="snooze-btn" disabled>Отложить (5 мин)</button>
      </div>
      <div class="alarm-status" id="alarm-status">Будильник не установлен</div>
    </div>


    <!-- МИРОВОЕ ВРЕМЯ -->
    <div class="world-time-section">
      <div class="world-time-title">🌍 Время в городах мира</div>
      <div class="cities-grid" id="cities-grid">
        <!-- Города будут добавлены JavaScript -->
      </div>
    </div>
  </div>
    <script src="./script.js"></script>
</body>

</html>
