<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Clock</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <h1>JS Clock</h1>
        <div class="clock">
            <div class="clock-face">
                <div class="center-circle"></div>
                <div class="hour-arrow"></div>
                <div class="minute-arrow"></div>
                <div class="second-arrow"></div>
                <div class="display-date"></div>
                <div class="number n12">12</div>
                <div class="number n3">3</div>
                <div class="number n6">6</div>
                <div class="number n9">9</div>
                <div class="marks-container"></div>
            </div>
        </div>
        <div class="controls-container">
        <button class="sound-btn">Mute</button>
        <button class="theme-btn">Theme</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
