<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="img/icon-aperture.png" sizes="16x16" />
  <link rel="stylesheet" href="style.css" />
  <title>Scoped CSS Variables and JS</title>
</head>
<body>
  <div class="app-container">
    <h2>
      Update CSS Variables with
      <span class="hl">JS</span>
    </h2>
    
    <!-- Фильтры (будут сдвигаться вверх) -->
    <div class="controls" id="controls">
      <h3>PhotoFilter</h3>

      <div class="presets">
        <button class="preset" data-preset="vintage">Vintage</button>
        <button class="preset" data-preset="neon">Neon</button>
        <button class="preset" data-preset="warm">Warm</button>
        <button class="preset" data-preset="cold">Cold</button>
        <button class="preset" data-preset="bw">B&W</button>
        <button class="preset" data-preset="reset">Reset</button>
      </div>

      <div class="filter-grid">
        <!-- все фильтры как раньше -->
        <label for="spacing">Spacing</label>
        <input id="spacing" type="range" name="spacing" min="10" max="200" value="10" data-sizing="px" />
        <span class="value-display" id="spacing-value">10px</span>

        <label for="blur">Blur</label>
        <input id="blur" type="range" name="blur" min="0" max="25" value="10" data-sizing="px" />
        <span class="value-display" id="blur-value">10px</span>

        <label for="scale">Scale</label>
        <input id="scale" type="range" name="scale" min="0.5" max="2" step="0.01" value="1" />
        <span class="value-display" id="scale-value">1</span>

        <label for="rotate">Rotate</label>
        <input id="rotate" type="range" name="rotate" min="0" max="360" value="0" data-sizing="deg" />
        <span class="value-display" id="rotate-value">0deg</span>

        <label for="saturate">Saturate</label>
        <input id="saturate" type="range" name="saturate" min="0" max="200" value="100" data-sizing="%" />
        <span class="value-display" id="saturate-value">100%</span>

        <label for="brightness">Brightness</label>
        <input id="brightness" type="range" name="brightness" min="0" max="200" value="100" data-sizing="%" />
        <span class="value-display" id="brightness-value">100%</span>

        <label for="contrast">Contrast</label>
        <input id="contrast" type="range" name="contrast" min="0" max="200" value="100" data-sizing="%" />
        <span class="value-display" id="contrast-value">100%</span>

        <label for="hue-rotate">Hue</label>
        <input id="hue-rotate" type="range" name="hue-rotate" min="0" max="360" value="0" data-sizing="deg" />
        <span class="value-display" id="hue-rotate-value">0deg</span>

        <label for="grayscale">Grayscale</label>
        <input id="grayscale" type="range" name="grayscale" min="0" max="100" value="0" data-sizing="%" />
        <span class="value-display" id="grayscale-value">0%</span>

        <label for="sepia">Sepia</label>
        <input id="sepia" type="range" name="sepia" min="0" max="100" value="0" data-sizing="%" />
        <span class="value-display" id="sepia-value">0%</span>

        <label for="base">Base color</label>
        <input id="base" type="color" name="base" value="#ffc600" />
      </div>
    </div>
    
    <!-- Изображение (центр) -->
    <div class="image-wrapper" id="imageWrapper">
      <img src="img/girl.jpg" alt="Photo" id="mainImage" />
    </div>

    <!-- Кнопки действий (будут сдвигаться вниз) -->
    <div class="action-buttons" id="actionButtons">
      <label for="upload" class="upload-btn">Upload Photo</label>
      <input type="file" id="upload" accept="image/*" style="display: none" />
      <button id="download">⬇ DOWNLOAD</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
