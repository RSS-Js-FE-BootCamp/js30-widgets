<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Vertical Slider</title>
</head>
<body>
    <div class="slider">
        <div class="left-slide">
            <div class="description description-1">Описание 1</div>
            <div class="description description-2">Описание 2</div>
            <div class="description description-3">Описание 3</div>
        </div>
        <div class="right-slide">
            <div class="slide slide-1"><img src="#" alt="Slide 1"></div>
            <div class="slide slide-2"><img src="#" alt="Slide 2"></div>
            <div class="slide slide-3"><img src="#" alt="Slide 3"></div>
        </div>
        <div class="action-buttons">
            <button class="up-button">Up</button>
            <button class="down-button">Down</button>
        </div>
      </div>
      <script src="./script.js"></script>
