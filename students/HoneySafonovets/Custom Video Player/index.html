<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>Drum Kit</title>
</head>
<body class="body">
  <div class="theme-widget">
    <img src="../shared/sun.png" alt="Sun" class="theme-widget__item">
  </div>
  <main class="drum">
    <div data-key="65" class="drum__box-item">
      <kbd>A</kbd>
      <span>clap</span>
    </div>
    <div data-key="83" class="drum__box-item">
      <kbd>S</kbd>
      <span>hihat</span>
    </div>
    <div data-key="68" class="drum__box-item">
      <kbd>D</kbd>
      <span>kick</span>
    </div>
    <div data-key="70" class="drum__box-item">
      <kbd>F</kbd>
      <span>openhat</span>
    </div>
    <div data-key="71" class="drum__box-item">
      <kbd>G</kbd>
      <span>boom</span>
    </div>
    <div data-key="72" class="drum__box-item">
      <kbd>H</kbd>
      <span>ride</span>
    </div>
    <div data-key="74" class="drum__box-item">
      <kbd>J</kbd>
      <span>snare</span>
    </div>
    <div data-key="75" class="drum__box-item">
      <kbd>K</kbd>
      <span>tom</span>
    </div>
    <div data-key="76" class="drum__box-item">
      <kbd>L</kbd>
      <span>tink</span>
    </div>
  </main>
  <script src="./main.js"></script>
</body>
</html>
