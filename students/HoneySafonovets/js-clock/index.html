<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/png" sizes="16x16" href="../shared/favicon.ico">
  <title>JS-clock</title>
</head>
<body class="body">
  <main class="js-clock">
    <h1 class="title">JS clock</h1>
    <div class="clock-wrapper">
      <div class="clock">
        <div class="arrow hour-arrow"></div>
        <div class="arrow min-arrow"></div>
        <div class="arrow second-arrow"></div>
        <div class="dot"></div>
      </div>
    </div>
  </main>
  <script src="./main.js"></script>
</body>
</html>
