<!doctype html>
<html lang="en">
  <head data-theme="light">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drum Kit</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="panel">
      <button class="panel-button switch-instrument" data-instrument="drum">
        drum
      </button>
      <button class="panel-button theme-toggle" data-theme="leght">leght</button>
    </div>

    <div class="drum active keys-container">
      <div class="drum-key" data-key="a">
        <kbd>a</kbd><span class="sound">clap</span>
      </div>
      <div class="drum-key" data-key="s">
        <kbd>s</kbd><span class="sound">hihat</span>
      </div>
      <div class="drum-key" data-key="d">
        <kbd>d</kbd><span class="sound">kick</span>
      </div>
      <div class="drum-key" data-key="f">
        <kbd>f</kbd><span class="sound">openhat</span>
      </div>
      <div class="drum-key" data-key="g">
        <kbd>g</kbd><span class="sound">boom</span>
      </div>
      <div class="drum-key" data-key="h">
        <kbd>h</kbd><span class="sound">ride</span>
      </div>
      <div class="drum-key" data-key="j">
        <kbd>j</kbd><span class="sound">snare</span>
      </div>
      <div class="drum-key" data-key="k">
        <kbd>k</kbd><span class="sound">tom</span>
      </div>
      <div class="drum-key" data-key="l">
        <kbd>l</kbd><span class="sound">tink</span>
      </div>
    </div>

    <div class="piano keys-container">
      <!-- White keys -->
      <div data-key="a" class="piano-key white"><kbd>a</kbd></div>
      <div data-key="s" class="piano-key white"><kbd>s</kbd></div>
      <div data-key="d" class="piano-key white"><kbd>d</kbd></div>
      <div data-key="f" class="piano-key white"><kbd>f</kbd></div>
      <div data-key="g" class="piano-key white"><kbd>g</kbd></div>
      <div data-key="h" class="piano-key white"><kbd>h</kbd></div>
      <div data-key="j" class="piano-key white"><kbd>j</kbd></div>

      <!-- Black keys -->
      <div data-key="e" class="piano-key black black-e"><kbd>e</kbd></div>
      <div data-key="t" class="piano-key black black-t"><kbd>t</kbd></div>
      <div data-key="y" class="piano-key black black-y"><kbd>y</kbd></div>
      <div data-key="u" class="piano-key black black-u"><kbd>u</kbd></div>
    </div>

    <audio data-key="a"></audio>
    <audio data-key="s"></audio>
    <audio data-key="d"></audio>
    <audio data-key="f"></audio>
    <audio data-key="g"></audio>
    <audio data-key="h"></audio>
    <audio data-key="j"></audio>
    <audio data-key="k"></audio>
    <audio data-key="l"></audio>
    <audio data-key="e"></audio>
    <audio data-key="t"></audio>
    <audio data-key="y"></audio>
    <audio data-key="u"></audio>

    <script src="./script.js"></script>
  </body>
</html>
