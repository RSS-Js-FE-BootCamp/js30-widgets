<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical Slider</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <div class="left-slider">
            <div class="info-container" style="background: linear-gradient(180deg, #000080,#4682B4, #FFa500,#ffd700);">
                <h1></h1>
                <p></p>
            </div>
             <div class="info-container"style="background: linear-gradient(180deg, #1e90ff,#1e90ff, #87cefa);">
                <h1></h1>
                <p></p>
            </div>
             <div class="info-container" style="background: linear-gradient(180deg, #2f4f4f, #778899, #d8bfd9, #ffe4b5);">
                <h1></h1>
                <p></p>
            </div>
             <div class="info-container" style="background: linear-gradient(45deg, #8b4515,#ff4500,#ffa500,#ffd700);">
                <h1></h1>
                <p></p>
            </div>
        </div>
        <div class="right-slider">
            <div class="image-slide" style="background-image: url(./images/5348199908592261430.jpg);"></div>
            <div class="image-slide" style="background-image: url(./images/5348199908592261458.jpg);"></div>
            <div class="image-slide" style="background-image: url(./images/5348199908592261431.jpg);"></div>
            <div class="image-slide" style="background-image: url(./images/5348199908592261481.jpg);"></div>

        </div>
        <div class="control-container">
            <button class="down-button">
                <i class="fas fa-arrow-down"></i>
            </button>
            <button class="up-button">
                <i class="fas fa-arrow-up"></i>
            </button>
        </div>
    </div>
    <script src="./scripts.js"></script>
</body>
</html>
