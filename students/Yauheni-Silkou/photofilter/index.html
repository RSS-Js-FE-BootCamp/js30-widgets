<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photofilter | by @Yauheni-Silkou</title>
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/variables.css" />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Update CSS Variables with <span class="highlight">JS</span></h1>
    </header>

    <main class="dashboard">
      <div class="controls-grid">
        <div class="grid-row">
          <label for="spacing">Spacing:</label>
          <input
            id="spacing"
            type="range"
            name="spacing"
            min="0"
            max="150"
            value="10"
            data-sizing="px"
          />
          <span class="value-display" data-link="spacing">10px</span>
        </div>

        <div class="grid-row">
          <label for="blur">Blur:</label>
          <input
            id="blur"
            type="range"
            name="blur"
            min="0"
            max="30"
            value="0"
            data-sizing="px"
          />
          <span class="value-display" data-link="blur">0px</span>
        </div>

        <div class="grid-row">
          <label for="brightness">Brightness:</label>
          <input
            id="brightness"
            type="range"
            name="brightness"
            min="0"
            max="200"
            value="100"
            data-sizing="%"
          />
          <span class="value-display" data-link="brightness">100%</span>
        </div>

        <div class="grid-row">
          <label for="contrast">Contrast:</label>
          <input
            id="contrast"
            type="range"
            name="contrast"
            min="0"
            max="200"
            value="100"
            data-sizing="%"
          />
          <span class="value-display" data-link="contrast">100%</span>
        </div>

        <div class="grid-row">
          <label for="grayscale">Grayscale:</label>
          <input
            id="grayscale"
            type="range"
            name="grayscale"
            min="0"
            max="100"
            value="0"
            data-sizing="%"
          />
          <span class="value-display" data-link="grayscale">0%</span>
        </div>

        <div class="grid-row">
          <label for="invert">Invert:</label>
          <input
            id="invert"
            type="range"
            name="invert"
            min="0"
            max="100"
            value="0"
            data-sizing="%"
          />
          <span class="value-display" data-link="invert">0%</span>
        </div>

        <div class="grid-row">
          <label for="sepia">Sepia:</label>
          <input
            id="sepia"
            type="range"
            name="sepia"
            min="0"
            max="100"
            value="0"
            data-sizing="%"
          />
          <span class="value-display" data-link="sepia">0%</span>
        </div>

        <div class="grid-row">
          <label for="saturate">Saturate:</label>
          <input
            id="saturate"
            type="range"
            name="saturate"
            min="0"
            max="300"
            value="100"
            data-sizing="%"
          />
          <span class="value-display" data-link="saturate">100%</span>
        </div>

        <div class="grid-row">
          <label for="hue-rotate">Hue Rotate:</label>
          <input
            id="hue-rotate"
            type="range"
            name="hue-rotate"
            min="0"
            max="360"
            value="0"
            data-sizing="deg"
          />
          <span class="value-display" data-link="hue-rotate">0deg</span>
        </div>

        <div class="grid-row">
          <label for="opacity">Opacity:</label>
          <input
            id="opacity"
            type="range"
            name="opacity"
            min="0"
            max="100"
            value="100"
            data-sizing="%"
          />
          <span class="value-display" data-link="opacity">100%</span>
        </div>

        <div class="grid-row">
          <label for="base">Base Color:</label>
          <input id="base" type="color" name="base" value="#ffc600" />
          <span class="value-display" data-link="base">#ffc600</span>
        </div>
      </div>

      <div class="canvas-container">
        <img
          id="target-photo"
          src="assets/img-sample.png"
          alt="Image sample: The cat painter is drawing colorful landscapes."
        />
      </div>

      <div class="presets-row">
        <button type="button" class="preset-button" data-preset="normal">
          Normal
        </button>
        <button type="button" class="preset-button" data-preset="vintage">
          Vintage
        </button>
        <button type="button" class="preset-button" data-preset="noir">
          Noir
        </button>
        <button type="button" class="preset-button" data-preset="sepia">
          Sepia
        </button>
        <button type="button" class="preset-button" data-preset="neon">
          Neon
        </button>
        <button type="button" class="preset-button" data-preset="edgy">
          Edgy
        </button>
        <button type="button" class="preset-button" data-preset="punchyCool">
          Punchy Cool
        </button>
        <button type="button" class="preset-button" data-preset="punchyWarm">
          Punchy Warm
        </button>
        <button type="button" class="preset-button" data-preset="blackAndWhite">
          Black & White
        </button>
        <button type="button" class="preset-button" data-preset="redPink">
          Red Pink
        </button>
        <button type="button" class="preset-button" data-preset="greenYellow">
          Green Yellow
        </button>
        <button type="button" class="preset-button" data-preset="bluePurple">
          Blue Purple
        </button>
        <button type="button" class="preset-button" data-preset="tealOrange">
          Teal Orange
        </button>
        <button type="button" class="preset-button" data-preset="blurred">
          Blurred
        </button>
      </div>
    </main>

    <script type="module" src="scripts/script.js"></script>
  </body>
</html>
