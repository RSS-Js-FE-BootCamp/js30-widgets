<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Video Player</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="./favicon.ico">
</head>

<body>
  <div class="body_wrapper">
    <div class="player_wrapper">
      <video class="video_player" src="./video/652333414.mp4">
      </video>
      <div class="video_controls">
        <div class="timeline_control_wrapper">
          <div class="timeline_control_line"></div>
        </div>
        <div class="hidden_control_settings">
          <button class="player_control play">►</button>
          <input type="range" class="range range_1"></input>
          <input type="range" class="range range_2"></input>
          <button class="backward">« 10s</button>
          <button class="forward">25s »</button>
        </div>
      </div>
    </div>
  </div>

</body>

<script src="./script.js"></script>

</html>
