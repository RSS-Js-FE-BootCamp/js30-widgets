<!DOCTYPE html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./favicon.ico">
</head>

<body>
    <main class="main">
        <div class="keys_wrapper">
            <div class="drum_key_wrapper" id="key_A">
                <div class="drum_key_letter">
                    A
                </div>
                <span class="drum_key_text">
                    Clap
                </span>
            </div>
            <div class="drum_key_wrapper" id="key_S">
                <div class="drum_key_letter">
                    S
                </div>
                <span class="drum_key_text">
                    Hihat
                </span>
            </div>
            <div class="drum_key_wrapper" id="key_D">
                <div class="drum_key_letter">
                    D
                </div>
                <span class="drum_key_text">
                    Kick
                </span>
            </div>
            <div class="drum_key_wrapper" id="key_F">
                <div class="drum_key_letter">
                    F
                </div>
                <span class="drum_key_text">
                    Openhat
                </span>
            </div>
            <div class="drum_key_wrapper" id="key_G">
                <div class="drum_key_letter">
                    G
                </div>
                <span class="drum_key_text">
                    Boom
                </span>
            </div>
            <div class="drum_key_wrapper" id="key_H">
                <div class="drum_key_letter">
                    H
                </div>
                <span class="drum_key_text">
                    Ride
                </span>
            </div>
            <div class="drum_key_wrapper" id="key_J">
                <div class="drum_key_letter">
                    J
                </div>
                <span class="drum_key_text">
                    Snare
                </span>
            </div>
            <div class="drum_key_wrapper" id="key_K">
                <div class="drum_key_letter">
                    K
                </div>
                <span class="drum_key_text">
                    Tom
                </span>
            </div>
            <div class="drum_key_wrapper" id="key_L">
                <div class="drum_key_letter">
                    L
                </div>
                <span class="drum_key_text">
                    Tink
                </span>
            </div>
        </div>
    </main>
</body>

<script src="./script.js"></script>
</html>
