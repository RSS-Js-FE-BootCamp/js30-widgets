<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom-video-player</title>
    <link rel="icon" href="./images/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>🎬 Custom Video Player China White</h1>
    </header>
    <section class="player-section">
        <div class="video-container">
            <video id="player" poster="" preload="metadata">
                <source src="" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div class="current-track-info">
                <span class="track-title"></span>
                <span class="track-artist"></span>
            </div>
            <div class="controls">
                <button class="play-btn" title="Play/Pause (Space)">▶</button>
                <div class="time-display">
                    <span class="current-time">0:00</span> / <span class="duration">0:00</span>
                </div>
                <input type="range" class="progress-bar" min="0" max="100" value="0" step="0.1">
                <div class="volume-control">
                    <button class="mute-btn" title="Mute (M)">🔊</button>
                    <input type="range" class="volume-slider" min="0" max="1" step="0.05" value="1">
                </div>
                <div class="speed-control">
                    <button class="speed-btn" data-speed="1">1×</button>
                </div>
                <button class="fullscreen-btn" title="Fullscreen (F)">⛶</button>
            </div>
        </div>
    </section>
    <section class="carousel-section">
        <h2>🎞️ Карусель треков</h2>
        <div class="carousel">
            <button class="carousel-prev">◀</button>
            <div class="carousel-track-wrapper">
                <div class="carousel-track"></div>
            </div>
            <button class="carousel-next">▶</button>
        </div>
    </section>
    <section class="catalog-section">
        <h2>📀 Каталог</h2>
        <div class="catalog-grid"></div>
    </section>
</body>

</html>
