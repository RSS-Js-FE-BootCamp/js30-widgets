<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drum Kit</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="drum-kit">
    <h1 class="drum-kit__title">Drum Kit</h1>

    <div class="keys">
      <button class="key" data-key="65">
        <kbd>A</kbd>
        <span>clap</span>
      </button>

      <button class="key" data-key="83">
        <kbd>S</kbd>
        <span>hihat</span>
      </button>

      <button class="key" data-key="68">
        <kbd>D</kbd>
        <span>kick</span>
      </button>

      <button class="key" data-key="70">
        <kbd>F</kbd>
        <span>openhat</span>
      </button>

      <button class="key" data-key="71">
        <kbd>G</kbd>
        <span>boom</span>
      </button>

      <button class="key" data-key="72">
        <kbd>H</kbd>
        <span>ride</span>
      </button>

      <button class="key" data-key="74">
        <kbd>J</kbd>
        <span>snare</span>
      </button>

      <button class="key" data-key="75">
        <kbd>K</kbd>
        <span>tom</span>
      </button>

      <button class="key" data-key="76">
        <kbd>L</kbd>
        <span>tink</span>
      </button>
    </div>
  </main>

  <audio data-key="65" src="./sounds/clap.wav"></audio>
  <audio data-key="83" src="./sounds/hihat.wav"></audio>
  <audio data-key="68" src="./sounds/kick.wav"></audio>
  <audio data-key="70" src="./sounds/openhat.wav"></audio>
  <audio data-key="71" src="./sounds/boom.wav"></audio>
  <audio data-key="72" src="./sounds/ride.wav"></audio>
  <audio data-key="74" src="./sounds/snare.wav"></audio>
  <audio data-key="75" src="./sounds/tom.wav"></audio>
  <audio data-key="76" src="./sounds/tink.wav"></audio>

  <script src="./script.js"></script>
</body>
</html>
