<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drum Kit</title>
  <link rel="icon" type="image/svg+xml" href="./images/favicon.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="drum-kit">
    <h1 class="drum-kit__title visually-hidden">Drum Kit</h1>

    <div class="keys">
      <button class="key" type="button" data-key="KeyA">
        <kbd>A</kbd>
        <span class="sound">clap</span>
      </button>

      <button class="key" type="button" data-key="KeyS">
        <kbd>S</kbd>
        <span class="sound">hihat</span>
      </button>

      <button class="key" type="button" data-key="KeyD">
        <kbd>D</kbd>
        <span class="sound">kick</span>
      </button>

      <button class="key" type="button" data-key="KeyF">
        <kbd>F</kbd>
        <span class="sound">openhat</span>
      </button>

      <button class="key" type="button" data-key="KeyG">
        <kbd>G</kbd>
        <span class="sound">boom</span>
      </button>

      <button class="key" type="button" data-key="KeyH">
        <kbd>H</kbd>
        <span class="sound">ride</span>
      </button>

      <button class="key" type="button" data-key="KeyJ">
        <kbd>J</kbd>
        <span class="sound">snare</span>
      </button>

      <button class="key" type="button" data-key="KeyK">
        <kbd>K</kbd>
        <span class="sound">tom</span>
      </button>

      <button class="key" type="button" data-key="KeyL">
        <kbd>L</kbd>
        <span class="sound">tink</span>
      </button>
    </div>

    <audio data-key="KeyA" src="./sounds/clap.wav"></audio>
    <audio data-key="KeyS" src="./sounds/hihat.wav"></audio>
    <audio data-key="KeyD" src="./sounds/kick.wav"></audio>
    <audio data-key="KeyF" src="./sounds/openhat.wav"></audio>
    <audio data-key="KeyG" src="./sounds/boom.wav"></audio>
    <audio data-key="KeyH" src="./sounds/ride.wav"></audio>
    <audio data-key="KeyJ" src="./sounds/snare.wav"></audio>
    <audio data-key="KeyK" src="./sounds/tom.wav"></audio>
    <audio data-key="KeyL" src="./sounds/tink.wav"></audio>
  </main>
  <script src="./script.js"></script>
</body>
</html>
