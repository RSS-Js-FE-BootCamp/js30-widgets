<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drum Kit</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="main">
    <section class="hero">
      <ul class="keys__list list-reset">
        <li class="keys__item">
          <kbd class="keys__kbd">A</kbd>
          <span class="keys__subtitle">
            clap
          </span>
        </li>
        <li class="keys__item">
          <kbd class="keys__kbd">S</kbd>
          <span class="keys__subtitle">
            hihat
          </span>
        </li>
        <li class="keys__item">
          <kbd class="keys__kbd">D</kbd>
          <span class="keys__subtitle">
            kick
          </span>
        </li>
        <li class="keys__item">
          <kbd class="keys__kbd">F</kbd>
          <span class="keys__subtitle">
            openhat
          </span>
        </li>
        <li class="keys__item">
          <kbd class="keys__kbd">G</kbd>
          <span class="keys__subtitle">
            boom
          </span>
        </li>
        <li class="keys__item">
          <kbd class="keys__kbd">H</kbd>
          <span class="keys__subtitle">
            ride
          </span>
        </li>
        <li class="keys__item">
          <kbd class="keys__kbd">J</kbd>
          <span class="keys__subtitle">
            snare
          </span>
        </li>
        <li class="keys__item">
          <kbd class="keys__kbd">K</kbd>
          <span class="keys__subtitle">
            tom
          </span>
        </li>
        <li class="keys__item">
          <kbd class="keys__kbd">L</kbd>
          <span class="keys__subtitle">
            tink
          </span>
        </li>
      </ul>
      <audio data-key="65" src="./sounds/clap.wav"></audio>
      <audio data-key="83" src="./sounds/hihat.wav"></audio>
      <audio data-key="68" src="./sounds/kick.wav"></audio>
      <audio data-key="70" src="./sounds/openhat.wav"></audio>
      <audio data-key="71" src="./sounds/boom.wav"></audio>
      <audio data-key="72" src="./sounds/ride.wav"></audio>
      <audio data-key="74" src="./sounds/snare.wav"></audio>
      <audio data-key="75" src="./sounds/tom.wav"></audio>
      <audio data-key="76" src="./sounds/tink.wav"></audio>
    </section>
  </main>
</body>

</html>
