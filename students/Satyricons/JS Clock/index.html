<!DOCTYPE html>
<html lang="en">

<head>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Clock</title>
</head>

<body>
    <!-- <h1>JS Clock</h1> -->

    <div class="container_clock">        
        <div class="tower">
            <div class="clock">
                <div class="clock-center">
                    <div class="sec"></div>
                    <div class="min"></div>
                    <div class="hour"></div>
                </div>
           
           <div class="digital_clock">
                <div class="first_dig">
                    <div class="dig_date"></div>
                    <div class="dig_month"></div>
                    <div class="dig_day"></div>
                </div>
                <div class="second_dig">
                    <div class="dig_hour">11</div>
                    <div class="dig_min">25</div>
                    <div class="dig_sec">00</div>
                </div>
            </div>           
            </div>
        </div>
    </div>
</body>

</html>
