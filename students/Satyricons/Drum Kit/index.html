<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="./style.css">
    <script src="./sound.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit</title>
</head>

<body>
    <div class="container_room">
        <div class="container_instrument_button">
            <div class="instruments">
                <button id='clap'>
                    <div class="word">A</div>
                    <select class="instrument" id='select_clap'>
                        <option>clap</option>
                        <option>clap2</option>
                        <option>clap3</option>
                    </select>
                </button>
                <button id='hat'>
                    <div class="word">S</div>
                    <select class="instrument" id='select_hat'>
                        <option>hat</option>
                        <option>hat2</option>
                        <option>hat3</option>
                    </select>
                </button>
                <button id='kik'>
                    <div class="word">D</div>
                    <select class="instrument" id='select_kik'>
                        <option>kik</option>
                        <option>kik2</option>
                        <option>kik3</option>
                    </select>
                </button>
                <button id='openhat'>
                    <div class="word">F</div>
                    <select class="instrument" id='select_openhat'>
                        <option>openhat</option>
                        <option>openhat2</option>
                        <option>openhat3</option>
                    </select>
                </button>
                <button id='boom'>
                    <div class="word">G</div>
                    <select class="instrument" id='select_boom'>
                        <option>boom</option>
                        <option>boom2</option>
                        <option>boom3</option>
                    </select>
                </button>
                <button id='ride'>
                    <div class="word">H</div>
                    <select class="instrument" id='select_ride'>
                        <option>ride</option>
                        <option>ride2</option>
                        <option>ride3</option>
                    </select>
                </button>
                <button id='snare'>
                    <div class="word">J</div>
                    <select class="instrument" id='select_snare'>
                        <option>snare</option>
                        <option>snare2</option>
                        <option>snare3</option>
                    </select>
                </button>
                <button id='tom'>
                    <div class="word">K</div>
                    <select class="instrument" id='select_tom'>
                        <option>tom</option>
                        <option>tom2</option>
                        <option>tom3</option>
                    </select>
                </button>
                <button id='tink'>
                    <div class="word">L</div>
                    <select class="instrument" id='select_tink'>
                        <option>tink</option>
                        <option>tink2</option>
                        <option>tink3</option>
                    </select>
                </button>
            </div>
        </div>




        <div class="container_piano">
            <div class="container_stop">
                <button id="stop">x</button>
                <button id='sint'>
                    <img src="./img/sint.png" alt="">
                    <select class="instrument" id='select_sint'>
                        <option>sint</option>
                        <option>sint2</option>
                        <option>sint3</option>
                    </select>
                </button>



            </div>
        </div>

    </div>
</body>

</html>
