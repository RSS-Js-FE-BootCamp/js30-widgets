<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="./style.css">
    <script src="./sound.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit</title>
</head>

<body>
    <div class="container_room">
        <div class="container_instrument_button ">
            <div class="instruments">
                
                <button id='clap'>
                    <div class="word">A</div>
                    <select class="instrument" id='select_clap'>
                    <option>clap</option>
                    <option>clap2</option>
                    <option>clap3</option>                    
                    </select>
                </button>
                
                <button id='hat'>
                    <div class="word" id='hat'>S</div>
                    <div class="instrument" id='input'>HiHat</div>
                </button>
                
                 <button id='kik'>
                    <div class="word" id='kik'>D</div>
                    <div class="instrument" id='input'>Kik</div>
                </button>
                
                <button id='openhat'>
                    <div class="word" id='openhat'>F</div>
                    <div class="instrument" id='input'>OpenHat</div>
                </button>
                
                <button id='boom'>
                    <div class="word" id='boom'>G</div>
                    <div class="instrument" id='input'>Boom</div>
                </button>
                
                
                <button id='ride'>
                    <div class="word" id='ride'>H</div>
                    <div class="instrument" id='ride'>Ride</div>
                </button>

                <button id='snare'>
                    <div class="word" id='snare'>J</div>
                    <div class="instrument" id='snare'>Snare</div>
                </button>

                <button id='tom'>
                    <div class="word" id='tom'>K</div>
                    <div class="instrument" id='tom'>Tom</div>
                </button>

                <button id='tink'>
                    <div class="word" id='tink'>L</div>
                    <div class="instrument" id='tink'>Tink</div>
                </button>                
             
            </div>
        </div>
    </div>



</body>

</html>
