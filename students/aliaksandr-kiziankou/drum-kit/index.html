<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon.svg">
</head>
<body>
    <div class="switch-container">
        <span>Instruments</span>
        <div class="switches">
            <div class="switch active" data-set="drums">
                <span>Drums</span>
            </div>
            <div class="switch" data-set="cowbell">
                <span>Cowbell</span>
            </div>
            <div class="switch" data-set="bass">
                <span>Bass</span>
            </div>
            <div class="switch" data-set="meme">
                <span>Meme</span>
            </div>
        </div>
    </div>
    <div class="instrument">
        <div class="key-row-asd">
            <div class="key" data-key="65">
                <kbd>A</kbd>
                <span class="sound">Hat</span>
            </div>
            <div class="key" data-key="83">
                <kbd>S</kbd>
                <span class="sound">Snare</span>
            </div>
            <div class="key" data-key="68">
                <kbd>D</kbd>
                <span class="sound">Foley</span>
            </div>
            <div class="key" data-key="70">
                <kbd>F</kbd>
                <span class="sound">Crash</span>
            </div>
            <div class="key" data-key="71">
                <kbd>G</kbd>
                <span class="sound">Kick</span>
            </div>
            <div class="key" data-key="72">
                <kbd>H</kbd>
                <span class="sound">Tom1</span>
            </div>
            <div class="key" data-key="74">
                <kbd>J</kbd>
                <span class="sound">Tom2</span>
            </div>
            <div class="key" data-key="75">
                <kbd>K</kbd>
                <span class="sound">Tom3</span>
            </div>
            <div class="key" data-key="76">
                <kbd>L</kbd>
                <span class="sound">Tom4</span>
            </div>
        </div>
    </div>

    <audio data-key="65" src="assets/sounds/drums/init/hi-hat.mp3"></audio>
    <audio data-key="83" src="assets/sounds/drums/init/snare.mp3"></audio>
    <audio data-key="68" src="assets/sounds/drums/init/foley.mp3"></audio>
    <audio data-key="70" src="assets/sounds/drums/init/crash.mp3"></audio>
    <audio data-key="71" src="assets/sounds/drums/init/kick.mp3"></audio>
    <audio data-key="72" src="assets/sounds/drums/init/tom1.mp3"></audio>
    <audio data-key="74" src="assets/sounds/drums/init/tom2.mp3"></audio>
    <audio data-key="75" src="assets/sounds/drums/init/tom3.mp3"></audio>
    <audio data-key="76" src="assets/sounds/drums/init/tom4.mp3"></audio>
    
    <a href="https://unsplash.com/photos/grayscale-photo-of-band-performing-on-stage-eiY4KJ62P5Q?utm_source=unsplash&utm_medium=referral&utm_content=creditShareLink" target="_blank" class="credits">Photo by Tim Toomey</a>

    <script src="script.js"></script>
</body>
</html>
