<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update Css Variables with JS</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Update Css Variables with <span class="text-highlight">Js</span></h1>
    <div class="controls">
      <label for="spacing">Spacing:</label>
      <input type="range" name="spacing" id="" />
      <label for="blur">Blur:</label>
      <input type="range" name="blur" id="" />
      <label for="brightness">Brightness:</label>
      <input type="range" name="brightness" id="" />
      <label for="saturate">Saturate:</label>
      <input type="range" name="saturate" id="" />
      <label for="color">Base color:</label>
      <input type="color" name="color" id="" />
    </div>
    <img src="./cat.jpg" alt="" />
  </body>
</html>
