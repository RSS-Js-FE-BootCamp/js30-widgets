<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update Css Variables with JS</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Update Css Variables with <span class="text-highlight">Js</span></h1>
    <div class="controls">
      <label for="spacing">Spacing:</label>
      <input
        type="range"
        name="spacing"
        id="spacing"
        min="0"
        max="100"
        value="10"
        data-sizing="px"
      />
      <label for="blur">Blur:</label>
      <input
        type="range"
        name="blur"
        id="blur"
        min="0"
        max="10"
        value="0"
        data-sizing="px"
      />
      <label for="brightness">Brightness:</label>
      <input
        type="range"
        name="brightness"
        id="brightness"
        min="0"
        max="200"
        value="100"
        data-sizing="%"
      />
      <label for="saturate">Saturate:</label>
      <input
        type="range"
        name="saturate"
        id="saturate"
        min="0"
        max="200"
        value="100"
        data-sizing="%"
      />
      <label for="base">Base color:</label>
      <input type="color" name="base" id="base" value="#9fcfb2" />
    </div>
    <img src="./cat.jpg" alt="" />
    <script src="./script.js"></script>
  </body>
</html>
