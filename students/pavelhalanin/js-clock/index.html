<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Clock (Pavel Halanin)</title>
</head>

<body>
    <div class="clock__container">
        <div class="clock__circle">
            <div id="hours_line" class="clock__hours_line"></div>
            <div id="minites_line" class="clock__minutes_line"></div>
            <div id="seconds_line" class="clock__seconds_line"></div>
            <div class="clock__center"></div>
        </div>
    </div>
    <div id="digital_segment_time" class="digital_segment_time">
        <span class="digital_segment_time__wrapper">
            <div class="seven_segment__container" data-symbol="0">
                <div data-segment="a"></div>
                <div data-segment="b"></div>
                <div data-segment="c"></div>
                <div data-segment="d"></div>
                <div data-segment="e"></div>
                <div data-segment="f"></div>
                <div data-segment="g"></div>
            </div>
            <div class="seven_segment__container" data-symbol="6">
                <div data-segment="a"></div>
                <div data-segment="b"></div>
                <div data-segment="c"></div>
                <div data-segment="d"></div>
                <div data-segment="e"></div>
                <div data-segment="f"></div>
                <div data-segment="g"></div>
            </div>
            <div class="segment_dots__container" data-is-on="true">
                <div data-segment="top"></div>
                <div data-segment="bottom"></div>
            </div>
            <div class="seven_segment__container" data-symbol="7">
                <div data-segment="a"></div>
                <div data-segment="b"></div>
                <div data-segment="c"></div>
                <div data-segment="d"></div>
                <div data-segment="e"></div>
                <div data-segment="f"></div>
                <div data-segment="g"></div>
            </div>
            <div class="seven_segment__container" data-symbol="8">
                <div data-segment="a"></div>
                <div data-segment="b"></div>
                <div data-segment="c"></div>
                <div data-segment="d"></div>
                <div data-segment="e"></div>
                <div data-segment="f"></div>
                <div data-segment="g"></div>
            </div>
            <div class="segment_dots__container" data-is-on="true">
                <div data-segment="top"></div>
                <div data-segment="bottom"></div>
            </div>
            <div class="seven_segment__container" data-symbol="9">
                <div data-segment="a"></div>
                <div data-segment="b"></div>
                <div data-segment="c"></div>
                <div data-segment="d"></div>
                <div data-segment="e"></div>
                <div data-segment="f"></div>
                <div data-segment="g"></div>
            </div>
            <div class="seven_segment__container" data-symbol="5">
                <div data-segment="a"></div>
                <div data-segment="b"></div>
                <div data-segment="c"></div>
                <div data-segment="d"></div>
                <div data-segment="e"></div>
                <div data-segment="f"></div>
                <div data-segment="g"></div>
            </div>
        </span>
    </div>
    <div id="text_datetime" class="datetime_table"></div>
    <script src="./script.js"></script>
    <script>
        (async function () {
            while (1) {
                await JSClockHelper.sleep(1000);
                JSClockHelper.setTextTime();
            }
        })();
    </script>
    <link rel="stylesheet" href="./style.css">
</body>

</html>
