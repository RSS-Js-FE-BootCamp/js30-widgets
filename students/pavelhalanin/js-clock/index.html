<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Clock (Pavel Halanin)</title>
</head>

<body>
    <div id="text-ru-date-and-time" class="datetime_table"></div>
    <script src="./script.js"></script>
    <script>
        (async function () {
            while (1) {
                await JSClockHelper.sleep(1000);
                JSClockHelper.setTextTime();
            }
        })();
    </script>
    <link rel="stylesheet" href="./style.css">
</body>

</html>
