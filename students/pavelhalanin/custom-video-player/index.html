<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Video Player (Pavel Halanin)</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="video__wrapper">
        <video id="video"
            src="https://irinainina.github.io/JavaScript30-1/11%20-%20Custom%20Video%20Player/652333414.mp4" width="640"
            height="358"></video>
        <div class="video__menu">
            <div class="video__progress_bar_wrapper">
                <div class="video__progress_bar_line" id="video__progress"></div>
            </div>
            <div class="video__bottom_menu">
                <button id="video__play_stop_button" class="video__play_stop_button"
                    onclick="CustomVideoPlayer.togglePlay()">▶</button>
                <button id="video__mute_button" class="video__mute_button"
                    onclick="CustomVideoPlayer.mute()">🔊</button>
                <div id="video__time" class="video__time"></div>
                <div class="video__speed">
                    🚀
                    <input id="video__speed_range" type="range" min="0.25" max="3" step="0.01"
                        oninput="CustomVideoPlayer.speedUpdate(event.target.value)">
                </div>
                <button class="video__full_screen_button"
                    title="Открыть видео в полном экране / Выйти из полного экрана"
                    onclick="CustomVideoPlayer.toggleVideoFullscreen()">
                    ⇳
                </button>
            </div>
        </div>
    </div>

    <div class="hot_keys">
        <div style="justify-content: space-between;">
            <div>
                Speed:
                <button onclick="CustomVideoPlayer.speedUpdate(1)">1</button>
                <button onclick="CustomVideoPlayer.speedUpdate(1.25)">1.25</button>
                <button onclick="CustomVideoPlayer.speedUpdate(1.5)">1.5</button>
                <button onclick="CustomVideoPlayer.speedUpdate(2)">2</button>
                <button onclick="CustomVideoPlayer.speedUpdate(3)">3</button>
            </div>
            <div>
                <div id="video__speed_value"></div>
            </div>
        </div>
        <div>
            <button class="key" title="Перемотка видео на 10%"
                onclick="CustomVideoPlayer.setVideoToPercent(0.1)">1</button>
            <button class="key" title="Перемотка видео на 20%"
                onclick="CustomVideoPlayer.setVideoToPercent(0.2)">2</button>
            <button class="key" title="Перемотка видео на 30%"
                onclick="CustomVideoPlayer.setVideoToPercent(0.3)">3</button>
            <button class="key" title="Перемотка видео на 40%"
                onclick="CustomVideoPlayer.setVideoToPercent(0.4)">4</button>
            <button class="key" title="Перемотка видео на 50%"
                onclick="CustomVideoPlayer.setVideoToPercent(0.5)">5</button>
            <button class="key" title="Перемотка видео на 60%"
                onclick="CustomVideoPlayer.setVideoToPercent(0.6)">6</button>
            <button class="key" title="Перемотка видео на 70%"
                onclick="CustomVideoPlayer.setVideoToPercent(0.7)">7</button>
            <button class="key" title="Перемотка видео на 80%"
                onclick="CustomVideoPlayer.setVideoToPercent(0.8)">8</button>
            <button class="key" title="Перемотка видео на 90%"
                onclick="CustomVideoPlayer.setVideoToPercent(0.9)">9</button>
            <button class="key" title="Перемотка видео на 0%"
                onclick="CustomVideoPlayer.setVideoToPercent(0)">0</button>
        </div>
        <div>
            <button class="key" title="Открыть видео в полном экране / Выйти из полного экрана"
                onclick="CustomVideoPlayer.toggleVideoFullscreen()">F</button>
            <button class="key" title="Переметка назад (на 5 секунд)" onclick="CustomVideoPlayer.minus5()">J</button>
            <button class="key" title="Запуск видео / Пауза видео" onclick="CustomVideoPlayer.togglePlay()">K</button>
            <button class="key" title="Переметка вперед (на 10 секунд)" onclick="CustomVideoPlayer.plus10()">L</button>
        </div>
        <div>
            <button class="key" title="Включение/выключение звука" onclick="CustomVideoPlayer.mute()">M</button>
        </div>
        <div>
            <button class="key" title="Запуск видео / Пауза видео"
                onclick="CustomVideoPlayer.togglePlay()">Пробел</button>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
