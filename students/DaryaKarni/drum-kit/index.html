<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drum Kit</title>
  <link rel="stylesheet" href="./drum.css">
</head>
<body>
  <div class="keys">
    <div data-key="65" class="key">
      <kbd>A</kbd>
      <span>clap</span>
    </div>
    <div data-key="83" class="key">
      <kbd>S</kbd>
      <span>hihat</span>
    </div>
    <div data-key="68" class="key">
      <kbd>D</kbd>
      <span>kick</span>
    </div>
    <div data-key="70" class="key">
      <kbd>F</kbd>
      <span>openhat</span>
    </div>
    <div data-key="71" class="key">
      <kbd>G</kbd>
      <span>boom</span>
    </div>
    <div data-key="72" class="key">
      <kbd>H</kbd>
      <span>ride</span>
    </div>
    <div data-key="74" class="key">
      <kbd>J</kbd>
      <span>snare</span>
    </div>
    <div data-key="75" class="key">
      <kbd>K</kbd>
      <span>tom</span>
    </div>
    <div data-key="76" class="key">
      <kbd>L</kbd>
      <span>tink</span>
    </div>
  </div>
  <audio data-key="65" src="./assets/clap.wav"></audio>
  <audio data-key="83" src="./assets/hihat.wav"></audio>
  <audio data-key="68" src="./assets/kick.wav"></audio>
  <audio data-key="70" src="./assets/openhat.wav"></audio>
  <audio data-key="71" src="./assets/boom.wav"></audio>
  <audio data-key="72" src="./assets/ride.wav"></audio>
  <audio data-key="74" src="./assets/snare.wav"></audio>
  <audio data-key="75" src="./assets/tom.wav"></audio>
  <audio data-key="76" src="./assets/tink.wav"></audio>

  <script>
    function playSoundKey(e){
      const audio = document.querySelector(`audio[data-key="${e.keyCode}"]`);
      const key = document.querySelector(`.key[data-key="${e.keyCode}"]`);
      if(!audio) return;
      key.classList.add('playing');
      audio.currentTime = 0;
      audio.play();
    }
    window.addEventListener('keydown', playSoundKey);
    const keys = document.querySelectorAll(".key");
    function removeTransition(e){
      if(e.propertyName !== "transform"){
        return;
      }
      this.classList.remove('playing');
    }
    keys.forEach(key => key.addEventListener('transitionend', removeTransition))
  </script>
</body>
</html>
