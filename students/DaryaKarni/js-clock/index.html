<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Clock</title>
  <link rel="stylesheet" href="./clock.css">
</head>
<body>
  <div class="date-text"></div>
  <div class="clock">
    <div class="hand hours"></div>
    <div class="hand mins"></div>
    <div class="hand secs"></div>
  </div>
  <script>
    const secondHand = document.querySelector(".secs");
    const minuteHand = document.querySelector(".mins");
    const hourHand = document.querySelector(".hours");
    const textDate = document.querySelector('.date-text');
    function setDate(){
      const now = new Date();
      const secs = now.getSeconds();
      const mins = now.getMinutes();
      const hours = now.getHours();
      const secsDegrees = ((secs/60) * 360) + 90;
      const minsDegrees = ((mins/60) * 360) + 90;
      const hoursDegrees = ((hours/12 + (mins/60)/12) * 360) + 90;
      secondHand.style.transform = `rotate(${secsDegrees}deg)`;
      minuteHand.style.transform = `rotate(${minsDegrees}deg)`;
      hourHand.style.transform = `rotate(${hoursDegrees}deg)`;

      const weekDay = now.toLocaleDateString('en-US', { weekday: 'long' });
      const monthDayNum = now.getDate();
      const monthDay = now.toLocaleString('en-US', { month: 'long' });
      const year = now.getFullYear();
      console.log(weekDay);
      textDate.innerText = `${hours}:${mins}:${secs} ${weekDay}, ${monthDayNum} ${monthDay} ${year}`;
    } 
    setInterval(setDate, 1000);

    /*mandatory*/
    
    
  </script>
</body>
</html>
