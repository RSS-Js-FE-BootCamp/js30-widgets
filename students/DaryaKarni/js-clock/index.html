<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Clock</title>
  <link rel="stylesheet" href="./clock.css">
  <script>
    if(localStorage.getItem('theme') === 'night'){
      document.querySelector('html').classList.add('night');
    }
  </script>
</head>
< >
  <button class="theme-button">
    <svg class="sun" xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-brightness-high" viewBox="0 0 16 16">
      <path  d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6m0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/>
    </svg>
    <svg class="moon hidden"xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-moon" viewBox="0 0 16 16">
      <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278M4.858 1.311A7.27 7.27 0 0 0 1.025 7.71c0 4.02 3.279 7.276 7.319 7.276a7.32 7.32 0 0 0 5.205-2.162q-.506.063-1.029.063c-4.61 0-8.343-3.714-8.343-8.29 0-1.167.242-2.278.681-3.286"/>
    </svg>
  </button>
  <div class="date-text"></div>
  <div class="clock">
    <div class="hand hours"></div>
    <div class="hand mins"></div>
    <div class="hand secs"></div>
  </div>
  <button class="do-nothing">do nothing 2 mins</button>
  <img class="cuckoo" src="./assets/cuckoo.png"/>

  <audio data-name="clock" src="./assets/clock-alarm.wav"></audio>
  <audio data-name="relax" src="./assets/relax.mp3"></audio>
  <audio data-name="cuckoo" src="./assets/krik-kukushki.mp3"></audio>

  <script>
    const secondHand = document.querySelector(".secs");
    const minuteHand = document.querySelector(".mins");
    const hourHand = document.querySelector(".hours");
    const textDate = document.querySelector('.date-text');
    const cuckoo = document.querySelector('.cuckoo');
    function setDate(){
      const now = new Date();
      const secs = now.getSeconds();
      const mins = now.getMinutes();
      const hours = now.getHours();
      const secsDegrees = ((secs/60) * 360) + 90;
      const minsDegrees = ((mins/60) * 360) + 90;
      const hoursDegrees = ((hours/12 + (mins/60)/12) * 360) + 90;
      secondHand.style.transform = `rotate(${secsDegrees}deg)`;
      minuteHand.style.transform = `rotate(${minsDegrees}deg)`;
      hourHand.style.transform = `rotate(${hoursDegrees}deg)`;

      const weekDay = now.toLocaleDateString('en-US', { weekday: 'long' });
      const monthDayNum = now.getDate();
      const monthDay = now.toLocaleString('en-US', { month: 'long' });
      const year = now.getFullYear();
      const zeroS = secs<10 ? '0' : '';
      const zeroM = mins<10 ? '0' : '';
      textDate.innerText = `${hours}:${zeroM}${mins}:${zeroS}${secs} ${weekDay}, ${monthDayNum} ${monthDay} ${year}`;
      const times = hours%12 === 0 ? 12 : hours % 12;
      if(mins === 0 && secs === 0){
        playCuckoo(times);
      }
    } 
    setInterval(setDate, 1000);
    
    const audioCuckoo = document.querySelector("[data-name=cuckoo]");
    function spawnCuckoo(times){
      cuckoo.classList.remove('seen');
      setTimeout(() => {
        cuckoo.classList.add('seen');
        cuckoo.style.setProperty('--times', `${times}`);
      }, 1600);
    }
    function playCuckoo(times){
      let count = 1;
      const interval = setInterval(()=>{
        if(count >= times){
          clearInterval(interval);
        }
        audioCuckoo.currentTime = 1.8;
        audioCuckoo.play();
        setTimeout(() => {
          audioCuckoo.pause();
        }, 1190);
        count++;
      }, 1600);
      spawnCuckoo(times);
      return interval;
    }
    /*theme changing*/
    const html = document.querySelector('html');
    const sun = document.querySelector('.sun');
    const moon = document.querySelector('.moon');
    function saveTheme(theme){
      localStorage.setItem('theme', theme);
    }
    function loadTheme(){
      const theme = localStorage.getItem('theme') || '';
      changeTheme(theme);
    }
    loadTheme();
    function changeTheme(theme){
      if(theme === 'night'){
        html.classList.add('night');
        sun.classList.add('hidden');
        moon.classList.remove('hidden');
      } else{
        html.classList.remove('night');
        sun.classList.remove('hidden');
        moon.classList.add('hidden');
      }
    }
    const themeButton = document.querySelector('.theme-button');
    themeButton.addEventListener('click', function(e){
      const theme = localStorage.getItem('theme') || '';
      if(theme === "night"){
        changeTheme('');
        saveTheme('');
      } else{
        changeTheme('night');
        saveTheme('night');
      }
    })

    /*timer*/
    const audioClock = document.querySelector('[data-name=clock]');
    const audioRelax = document.querySelector('[data-name=relax]');
    let zero = '';
    function startTimer(mins, secs){
    const tickTimer = setInterval(() => {
      if(secs === 0){
        if(mins === 0){
          audioClock.currentTime = 0;
          audioClock.play();
          timerButton.innerText = 'time is out';
          clearInterval(tickTimer);
          setTimeout(() => {
          timerButton.innerText = 'do nothing 2 mins';
          timerButton.disabled = false;
          },8000);
        } else{
        secs = 59
        mins--;
        }
      }else{
        secs--;
      }
      zero = secs<10 ? '0' : '';
      timerButton.innerText = `${mins}:${zero}${secs}`;
      }, 1000)
    return tickTimer;
    };

    const timerButton = document.querySelector('.do-nothing');
    timerButton.addEventListener('click', function(e){
      this.innerText = `2:00`;
      this.disabled = true;
      startTimer(2,0);  
      audioRelax.currentTime = 0;
      audioRelax.play();
      setTimeout(() => {
        audioRelax.pause();
      }, 120000);
    })

    console.log('%c=== Self-evaluation: Clock JS ===', 'font-weight:bold;font-size:14px');
    console.table([
      { stage: 1, item: 'Visual match with original', claimed: 10 },
      { stage: 1, item: 'Core behaviour (basic clock)', claimed: 10 },
      { stage: 2, item: 'Mandatory feature: date display', claimed: 15 },
      { stage: 3, item: 'Optional: Dark / light theme toggle that persists across reloads', claimed: 10 },
      { stage: 3, item: 'Optional: A "do nothing for 2 minutes" relaxation mode with a timer ', claimed: 10 },
      { stage: 3, item: 'Optional: A cuckoo clock - at the top of each hour the bird pops out and chimes',     claimed: 10 },
    ]);
    console.log('Claimed total: 65/65');
  </script>
</body>
</html>
