<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Player</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="icon"
      href="./img/free-icon-media-player-2951242.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="media-player">
      <video class="media-player__video video-viewer"></video>
      <div class="media-player__controls">
        <div class="timeline">
          <div class="timeline__filled"></div>
        </div>
        <button class="media-player__button play-toggle" title="Toggle Play">
          &#9658;
        </button>
        <input
          type="range"
          name="volume"
          class="media-player__slider"
          min="0"
          max="1"
          step="0.05"
          value="1"
        />
        <input
          type="range"
          name="playbackRate"
          class="media-player__slider"
          min="0.5"
          max="2"
          step="0.1"
          value="1"
        />
        <button data-skip="-10" class="media-player__button">&#171; 10s</button>
        <button data-skip="10" class="media-player__button">10s &#187;</button>
      </div>
    </div>
    <section class="movie-catalog"></section>
    <div class="video-navigation">
      <button class="video-navigation__button prev-video">Previous</button>
      <button class="video-navigation__button next-video">Next</button>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
