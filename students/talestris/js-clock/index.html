<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Clock</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">

    <style>
        html {
            background: url(./bg-pic.webp);
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            font-size: 10px;
        }

        body {
            display: flex;
            flex: 1;
            font-size: 2em;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            margin: 0;
            justify-content: center;
        }

        .clock {
            position: relative;
            width: 35rem;
            height: 35rem;
            border: 1em solid rgb(51, 53, 37);
            border-radius: 50%;
            margin: 3.1em auto;
            padding: 2rem;
            box-shadow:
                0 0 0 0.25rem rgba(0, 0, 0, 0.1),
                inset 0 0 0 0.188rem #EFEFEF,
                inset 0 0 0.625rem black,
                0 0 0.625rem rgba(0, 0, 0, 0.2);
        }

        .clock-face {
            position: relative;
            width: 100%;
            height: 100%;
            transform: translateY(-0.188rem);
        }

        .clock-numbers {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .number {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: calc(50% - 2.5rem);
            left: calc(50% - 2.5rem);
            width: 5rem;
            height: 5rem;
            font-size: 4rem;
            font-weight: bold;
            color: rgb(51, 53, 37);
        }

        .hand {
            position: absolute;
            top: 50%;
            background: black;
            transform-origin: 100%;
            transform: rotate(90deg);
            transition: all 0.05s;
            transition-timing-function: cubic-bezier(0.1, 2.7, 0.58, 1);
        }

        .hand__hours {
            width: 30%;
            left: 20%;
            height: 0.6rem;
        }

        .hand__minutes {
            width: 40%;
            left: 10%;
            height: 0.4rem;
        }

        .hand__seconds {
            width: 45%;
            left: 5%;
            height: 0.2rem;
        }

        .digital-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            font-family: inherit;
            color: rgb(51, 53, 37);
            font-size: 3rem;
            font-weight: 600;
        }

        .digital-time {
            font-size: 5rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        .timezones-panel {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-top: 2rem;
        }

        .timezone {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.1);
            padding: 1rem 2rem;
            border-radius: 0.8rem;
            min-width: 10rem;
            box-shadow: 0 0.4rem 0.6rem rgba(0, 0, 0, 0.1);
        }

        .city-name {
            font-size: 1.4rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            color: rgb(51, 53, 37);
            margin-bottom: 0.5rem;
        }

        .city-time {
            font-size: 2.2rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            color: rgb(51, 53, 37);
        }
    </style>
</head>

<body>
    <div class="clock">
        <div class="clock-face">
            <div class="clock-numbers"></div>
            <div class="hand hand__hours"></div>
            <div class="hand hand__minutes"></div>
            <div class="hand hand__seconds"></div>
        </div>
    </div>
    <div class="digital-panel">
        <span class="digital-time">00:00:00</span>
        <span class="digital-date">Weekday, 0 Day Month 2026 Year</span>
    </div>
    <div class="timezones-panel">
        <div class="timezone">
            <span class="city-name">London</span>
            <span class="city-time" id="london-time">00:00:00</span>
        </div>
        <div class="timezone">
            <span class="city-name">Tokio</span>
            <span class="city-time" id="tokio-time">00:00:00</span>
        </div>
        <div class="timezone">
            <span class="city-name">New York</span>
            <span class="city-time" id="new-york-time">00:00:00</span>
        </div>
    </div>
    <script>
        const numbersContainer = document.querySelector('.clock-numbers');

        const digitalTimeContainer = document.querySelector('.digital-time');
        const digitalDateContainer = document.querySelector('.digital-date');

        const londonContainer = document.querySelector('#london-time');
        const tokioContainer = document.querySelector('#tokio-time');
        const newYorkContainer = document.querySelector('#new-york-time');

        for (let i = 1; i <= 12; i++) {
            const numberDiv = document.createElement('div');
            numberDiv.classList.add('number');
            numberDiv.textContent = i;

            const angle = i * 30;

            numberDiv.style.transform = `rotate(${angle}deg) translateY(-15rem) rotate(-${angle}deg)`;

            numbersContainer.appendChild(numberDiv);
        }

        const secondsHand = document.querySelector('.hand__seconds');
        const minsHand = document.querySelector('.hand__minutes');
        const hoursHand = document.querySelector('.hand__hours');

        let secondsCycles = 0;
        let minutesCycles = 0;
        let hoursCycles = 0;

        let lastSeconds = 0;
        let lastMinutes = 0;
        let lastHours = 0;

        function setDate() {
            const now = new Date();

            const seconds = now.getSeconds();
            const mins = now.getMinutes();
            const hours = now.getHours();

            if (seconds < lastSeconds) secondsCycles++;
            lastSeconds = seconds;
            const totalSeconds = seconds + (secondsCycles * 60);

            if (mins < lastMinutes) minutesCycles++;
            lastMinutes = mins;
            const totalMinutes = mins + (minutesCycles * 60);

            const hours12 = hours % 12;
            if (hours12 < lastHours) hoursCycles++;
            lastHours = hours12;
            const totalHours = hours12 + (hoursCycles * 12);

            const secondsDegrees = ((totalSeconds / 60) * 360) + 90;
            const minsDegrees = ((totalMinutes / 60) * 360) + (seconds * 0.1) + 90;
            const hoursDegrees = ((totalHours / 12) * 360) + (mins * 0.5) + 90;

            secondsHand.style.transform = `rotate(${secondsDegrees}deg)`;
            minsHand.style.transform = `rotate(${minsDegrees}deg)`;
            hoursHand.style.transform = `rotate(${hoursDegrees}deg)`;

            digitalTimeContainer.textContent = now.toLocaleTimeString('en-US', { hour12: false });
            digitalDateContainer.textContent = now.toLocaleDateString('en-US', {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            });

            londonContainer.textContent = now.toLocaleTimeString('en-US', { timeZone: 'Europe/London', hour12: false });
            tokioContainer.textContent = now.toLocaleTimeString('en-US', { timeZone: 'Asia/Tokyo', hour12: false });
            newYorkContainer.textContent = now.toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour12: false });
        }

        setInterval(setDate, 1000);

        setDate();
    </script>
</body>

</html>
