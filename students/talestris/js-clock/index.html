<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Clock</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">

    <style>
        html {
            background: url(./bg-pic.jpg);
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            font-size: 10px;
        }

        body {
            display: flex;
            flex: 1;
            font-size: 2em;
            align-items: center;
            min-height: 100vh;
        }

        .clock {
            position: relative;
            width: 32rem;
            height: 32rem;
            border: 1em solid white;
            border-radius: 50%;
            margin: 3.1em auto;
            padding: 2rem;
            box-shadow:
                0 0 0 0.25rem rgba(0, 0, 0, 0.1),
                inset 0 0 0 0.188rem #EFEFEF,
                inset 0 0 0.625rem black,
                0 0 0.625rem rgba(0, 0, 0, 0.2);
        }

        .clock-face {
            position: relative;
            width: 100%;
            height: 100%;
            transform: translateY(-0.188rem);
        }

        .hand {
            width: 50%;
            height: 0.5em;
            position: absolute;
            top: 50%;
            background: black;
            transform-origin: 100%;
            transform: rotate(90deg);
            transition: all 0.05s;
            transition-timing-function: cubic-bezier(0.1, 2.7, 0.58, 1);
        }
    </style>
</head>

<body>
    <div class="clock">
        <div class="clock-face">
            <div class="hand hand__hours"></div>
            <div class="hand hand__minutes"></div>
            <div class="hand hand__seconds"></div>
        </div>
    </div>
    <script>
        const secondsHand = document.querySelector('.hand__seconds');
        const minsHand = document.querySelector('.hand__minutes');
        const hoursHand = document.querySelector('.hand__hours');

        function setDate() {
            const now = new Date();

            const seconds = now.getSeconds();
            const secondsDegrees = ((seconds / 60) * 360) + 90;
            secondsHand.style.transform = `rotate(${secondsDegrees}deg)`;

            const mins = now.getMinutes();
            const minsDegrees = ((mins / 60) * 360) + 90;
            minsHand.style.transform = `rotate(${minsDegrees}deg)`;

            const hours = now.getHours();
            const hoursDegrees = ((hours / 12) * 360) + 90;
            hoursHand.style.transform = `rotate(${hoursDegrees}deg)`;
        }

        setInterval(setDate, 1000);

        setDate();
    </script>
</body>

</html>
