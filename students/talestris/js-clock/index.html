<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Clock</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">

    <style>
        html {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            font-size: 10px;
        }

        body {
            display: flex;
            flex: 1;
            font-size: 2em;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            margin: 0;
            justify-content: center;
            background: url(./bg-pic.webp);
            background-size: cover;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1.6rem;
            font-size: 1.4rem;
            font-weight: bold;
            font-family: inherit;
            border: 0.2rem solid rgb(51, 53, 37);
            border-radius: 2rem;
            background: rgba(255, 255, 255, 0.8);
            color: rgb(51, 53, 37);
            transition: all 0.2s ease;
            box-shadow: 0 0.4rem 0.6rem rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        .hands-mode-toggle-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
        }

        .theme-toggle-btn {
            position: absolute;
            top: 2rem;
            right: 2rem;
        }

        .btn:hover {
            background: white;
            transform: translateY(-0.2rem);
            box-shadow: 0 0.6rem 0.8rem rgba(0, 0, 0, 0.15);
        }

        .clock {
            position: relative;
            width: 35rem;
            height: 35rem;
            border: 1em solid rgb(51, 53, 37);
            border-radius: 50%;
            margin: 3.1em auto;
            padding: 2rem;
            box-shadow:
                0 0 0 0.25rem rgba(0, 0, 0, 0.1),
                inset 0 0 0 0.188rem #EFEFEF,
                inset 0 0 0.625rem black,
                0 0 0.625rem rgba(0, 0, 0, 0.2);
        }

        .clock-face {
            position: relative;
            width: 100%;
            height: 100%;
            transform: translateY(-0.188rem);
        }

        .clock-numbers {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .number {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: calc(50% - 2.5rem);
            left: calc(50% - 2.5rem);
            width: 5rem;
            height: 5rem;
            font-size: 4rem;
            font-weight: bold;
            color: rgb(51, 53, 37);
        }

        .hand {
            position: absolute;
            top: 50%;
            background: black;
            transform-origin: 100%;
            transform: rotate(90deg);
            transition: none;

        }

        .hand.ticking-mode {
            transition-timing-function: cubic-bezier(0.1, 2.7, 0.58, 1);
        }

        .hand__hours {
            width: 30%;
            left: 20%;
            height: 0.6rem;
        }

        .hand__minutes {
            width: 40%;
            left: 10%;
            height: 0.4rem;
        }

        .hand__seconds {
            width: 45%;
            left: 5%;
            height: 0.2rem;
        }

        .digital-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            font-family: inherit;
            color: rgb(51, 53, 37);
            font-size: 3rem;
            font-weight: 600;
        }

        .digital-time {
            font-size: 5rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        .timezones-panel {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-top: 2rem;
        }

        .timezone {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem 2rem;
            border-radius: 0.8rem;
            min-width: 10rem;
            box-shadow: 0 0.4rem 0.6rem rgba(0, 0, 0, 0.3);
        }

        .city-name {
            font-size: 1.4rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            color: rgb(51, 53, 37);
            margin-bottom: 0.5rem;
        }

        .city-time {
            font-size: 2.2rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            color: rgb(51, 53, 37);
        }

        body.dark-theme {
            background: radial-gradient(#020222, #06042c);
        }

        body.dark-theme .clock {
            border: 1em solid rgb(174, 179, 136);
        }

        /*body.dark-theme .number {
            color: white;
        }*/
    </style>
</head>

<body>
    <button class="hands-mode-toggle-btn btn" type="button" aria-label="toggle clock hands mode">🔄 Smooth Mode</button>
    <button class="theme-toggle-btn btn" type="button" aria-label="toggle dark/light theme">
        <span class="theme-btn-icon">🌙</span> Dark Mode
    </button>
    <div class="clock">
        <div class="clock-face">
            <div class="clock-numbers"></div>
            <div class="hand hand__hours"></div>
            <div class="hand hand__minutes"></div>
            <div class="hand hand__seconds"></div>
        </div>
    </div>
    <div class="digital-panel">
        <span class="digital-time">00:00:00</span>
        <span class="digital-date">Weekday, 0 Day Month 2026 Year</span>
    </div>
    <div class="timezones-panel">
        <div class="timezone">
            <span class="city-name">London</span>
            <span class="city-time" id="london-time">00:00:00</span>
        </div>
        <div class="timezone">
            <span class="city-name">Tokio</span>
            <span class="city-time" id="tokio-time">00:00:00</span>
        </div>
        <div class="timezone">
            <span class="city-name">New York</span>
            <span class="city-time" id="new-york-time">00:00:00</span>
        </div>
    </div>
    <script>
        const numbersContainer = document.querySelector('.clock-numbers');

        const digitalTimeContainer = document.querySelector('.digital-time');
        const digitalDateContainer = document.querySelector('.digital-date');

        const londonContainer = document.querySelector('#london-time');
        const tokioContainer = document.querySelector('#tokio-time');
        const newYorkContainer = document.querySelector('#new-york-time');

        const themeBtn = document.querySelector('.theme-toggle-btn');

        const modeBtn = document.querySelector('.hands-mode-toggle-btn');
        const allHands = document.querySelectorAll('.hand');

        let isTicking = localStorage.getItem('clock-mode') === 'ticking';
        let clockTimer;

        function applyClockMode() {
            allHands.forEach(hand => {
                if (isTicking) {
                    hand.classList.add('ticking-mode');
                    modeBtn.innerHTML = '🔄 Smooth Mode';
                } else {
                    hand.classList.remove('ticking-mode');
                    modeBtn.innerHTML = '⏰ Ticking Mode';
                }
            });
        }

        modeBtn.addEventListener('click', () => {
            isTicking = !isTicking;
            localStorage.setItem('clock-mode', isTicking ? 'ticking' : 'smooth');
            applyClockMode();
            setDate();
        });

        applyClockMode();

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');

            const isDark = document.body.classList.contains('dark-theme');

            if (isDark) {
                themeBtn.innerHTML = '☀️ Light Mode';
            } else {
                themeBtn.innerHTML = '🌙 Dark Mode';
            }

            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        const chosenTheme = localStorage.getItem('theme');

        if (chosenTheme === 'dark') {
            document.body.classList.add('dark-theme');
            themeBtn.innerHTML = '☀️ Light Mode';
        }

        for (let i = 1; i <= 12; i++) {
            const numberDiv = document.createElement('div');
            numberDiv.classList.add('number');
            numberDiv.textContent = i;

            const angle = i * 30;

            numberDiv.style.transform = `rotate(${angle}deg) translateY(-15rem) rotate(-${angle}deg)`;

            numbersContainer.appendChild(numberDiv);
        }

        const secondsHand = document.querySelector('.hand__seconds');
        const minsHand = document.querySelector('.hand__minutes');
        const hoursHand = document.querySelector('.hand__hours');

        let secondsCycles = 0;
        let minutesCycles = 0;
        let hoursCycles = 0;

        let lastSeconds = 0;
        let lastMinutes = 0;
        let lastHours = 0;

        function setDate() {
            const now = new Date();

            const seconds = now.getSeconds();
            const mins = now.getMinutes();
            const hours = now.getHours();
            const ms = now.getMilliseconds();
            const timeZoneOffsetMs = now.getTimezoneOffset() * 60 * 1000;
            const timeMs = now.getTime() - timeZoneOffsetMs;

            const smoothSecondsDeg = ((timeMs / 1000) * 6) % 360 + 90;
            const smoothMinsDeg = ((timeMs / 1000 / 60) * 6) % 360 + 90;
            const smoothHoursDeg = ((timeMs / 1000 / 60 / 12) * 6) % 360 + 90;

            const tickingSecondsDeg = ((seconds / 60) * 360) + 90;
            const tickingMinsDeg = ((mins / 60) * 360) + ((seconds / 60) * 6) + 90;
            const tickingHoursDeg = (((hours % 12) / 12) * 360) + ((mins / 60) * 30) + 90;

            /*if (seconds < lastSeconds) secondsCycles++;
            lastSeconds = seconds;
            const exactSeconds = seconds + (isTicking ? 0 : ms / 1000);
            const totalSeconds = exactSeconds + (secondsCycles * 60);

            if (mins < lastMinutes) minutesCycles++;
            lastMinutes = mins;
            const totalMinutes = mins + (minutesCycles * 60);

            const hours12 = hours % 12;
            if (hours12 < lastHours) hoursCycles++;
            lastHours = hours12;
            const totalHours = hours12 + (hoursCycles * 12);

            const secondsDegrees = ((totalSeconds / 60) * 360) + 90;
            const minsDegrees = ((totalMinutes / 60) * 360) + (exactSeconds * 0.1) + 90;
            const hoursDegrees = ((totalHours / 12) * 360) + (mins * 0.5) + 90;*/

            secondsHand.style.transform = `rotate(${isTicking ? tickingSecondsDeg : smoothSecondsDeg}deg)`;
            minsHand.style.transform = `rotate(${isTicking ? tickingMinsDeg : smoothMinsDeg}deg)`;
            hoursHand.style.transform = `rotate(${isTicking ? tickingHoursDeg : smoothHoursDeg}deg)`;

            digitalTimeContainer.textContent = now.toLocaleTimeString('en-US', { hour12: false });
            digitalDateContainer.textContent = now.toLocaleDateString('en-US', {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            });

            londonContainer.textContent = now.toLocaleTimeString('en-US', { timeZone: 'Europe/London', hour12: false });
            tokioContainer.textContent = now.toLocaleTimeString('en-US', { timeZone: 'Asia/Tokyo', hour12: false });
            newYorkContainer.textContent = now.toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour12: false });

            const delay = isTicking ? (1000 - now.getMilliseconds()) : 50;
            clearTimeout(clockTimer);
            clockTimer = setTimeout(setDate, delay);
        }

        setDate();
    </script>
</body>

</html>
