<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" type="image/png" href="./assets/icons/favicone.png" />
    <title>Drum-kit</title>
  </head>
  <body>
    <div class="container__keys">
      <button class="button__key" data-key="KeyA" data-action="clap">
        <span class="letter">A</span>
        <span class="sound">CLAP</span>
      </button>
      <button class="button__key" data-key="KeyS" data-action="hihat">
        <span class="letter">S</span>
        <span class="sound">HIHAT</span>
      </button>
      <button class="button__key" data-key="KeyD" data-action="kick">
        <span class="letter">D</span>
        <span class="sound">KICK</span>
      </button>
      <button class="button__key" data-key="KeyF" data-action="openhat">
        <span class="letter">F</span>
        <span class="sound">OPENHAT</span>
      </button>
      <button class="button__key" data-key="KeyG" data-action="boom">
        <span class="letter">G</span>
        <span class="sound">BOOM</span>
      </button>
      <button class="button__key" data-key="KeyH" data-action="ride">
        <span class="letter">H</span>
        <span class="sound">RIDE</span>
      </button>
      <button class="button__key" data-key="KeyJ" data-action="snare">
        <span class="letter">J</span>
        <span class="sound">SNARE</span>
      </button>
      <button class="button__key" data-key="KeyK" data-action="tom">
        <span class="letter">K</span>
        <span class="sound">TOM</span>
      </button>
      <button class="button__key" data-key="KeyL" data-action="tink">
        <span class="letter">L</span>
        <span class="sound">TINK</span>
      </button>

      <audio data-key="KeyA" src="./assets/sounds/clap.wav"></audio>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
